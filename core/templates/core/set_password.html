{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}

{% block content %}
<style>
    body { background: #f7f8fb !important; color: #111 !important; }
    :root, body, [data-theme="dark"] body {
        --bg: #f7f8fb;
        --text: #111;
        --card: #fff;
        --border: #e5e7eb;
        --muted: #6b7280;
    }
</style>
<h2>Setup New Password</h2>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Save Password</button>
    </form>
</div>

<p><small>For security, you must change your password before continuing.</small></p>
{% endblock %}
